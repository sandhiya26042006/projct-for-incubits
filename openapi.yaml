openapi: 3.1.0
info:
  title: PS1 Background Music Engine Demo API
  version: 1.0.0
  description: Procedural mock audio only; not AI-generated.
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        '200': {description: Service is running}
  /ready:
    get:
      summary: Readiness check
      responses:
        '200': {description: Demo provider is ready}
  /api/v1/music/jobs:
    post:
      summary: Start asynchronous mock music generation
      parameters:
        - in: header
          name: Idempotency-Key
          schema: {type: string}
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, duration_s]
              properties:
                prompt: {type: string, minLength: 1}
                duration_s: {type: number, minimum: 5, maximum: 300}
                sections: {type: array, items: {type: object, required: [start_s, mood], properties: {start_s: {type: number}, mood: {type: string}}}}
                tempo_bpm: {type: number, minimum: 30, maximum: 300}
                key: {type: string}
                loopable: {type: boolean}
                narration_url: {type: string, format: uri}
                seed: {type: integer}
                output: {type: object, properties: {sample_rate: {type: integer, enum: [48000]}, target_lufs: {type: number}, formats: {type: array, items: {type: string, enum: [wav, mp3]}}}}
      responses:
        '202': {description: Job accepted}
        '400': {description: Validation error}
  /api/v1/jobs/{job_id}:
    get:
      summary: Poll job status and retrieve output links
      parameters:
        - in: path
          name: job_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Current job state}
        '404': {description: Job not found}
  /api/v1/jobs/{job_id}/files/{filename}:
    get:
      summary: Download a completed audio artifact or manifest
      parameters:
        - in: path
          name: job_id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: filename
          required: true
          schema: {type: string}
      responses:
        '200': {description: Requested file}
        '404': {description: File not found}
